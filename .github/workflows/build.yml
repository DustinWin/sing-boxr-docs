name: Build Docs
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Shanghai"
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"

permissions:
  contents: write
  actions: write
  pages: write

jobs:
  assess:
    runs-on: ubuntu-latest
    outputs:
      latest_version: ${{ steps.version.outputs.latest_version }}
      current_version: ${{ steps.version.outputs.current_version }}
      update_docs: ${{ steps.compare.outputs.update_docs }}
    steps:
      - name: Get `sing-box` version
        id: version
        run: |
          echo "latest_version=$(curl -fsSL https://api.github.com/repos/reF1nd/sing-box/tags | jq -r '.[].name' | grep -Po '^v\K.*(alpha|beta|rc).*-reF1nd.*' | head -n 1)" >> "${GITHUB_OUTPUT}"
          echo "current_version=$(curl -fsSL https://github.com/DustinWin/proxy-tools/releases/tag/sing-box | grep -oP '(?<=v)\d+\.\d+\.\d+.*?(alpha|beta|rc).*?-reF1nd[^，]*' | head -n 1)" >> "${GITHUB_OUTPUT}"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.version.outputs.latest_version }}" != "${{ steps.version.outputs.current_version }}" ]; then
            echo "当前 sing-box reF1nd 版 docs 有更新 v${{ steps.version.outputs.latest_version }}"
            update_docs=true
          else
            echo "当前 sing-box reF1nd 版 docs 已是最新版 v${{ steps.version.outputs.current_version }}"
            update_docs=false
          fi
          echo "update_docs=${update_docs}" >> "${GITHUB_OUTPUT}"

  build:
    runs-on: ubuntu-latest
    if: ${{ needs.assess.outputs.update_docs == 'true' }}
    needs: assess
    env:
      ref1nd_VERSION: ${{ needs.assess.outputs.latest_version }}
    steps:
      - name: Checkout `reF1nd-testing`
        uses: actions/checkout@v7
        with:
          repository: reF1nd/sing-box
          ref: reF1nd-testing
          fetch-depth: 0

      - name: Get `Python` version
        id: python
        run: |
          echo "python_version=$(curl -fsSL https://endoflife.date/api/python.json | jq -r '.[0].latest')" >> "${GITHUB_OUTPUT}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.python_version }}

      - name: Install and build docs
        run: |
          pip install mkdocs
          pip install mkdocs-material
          pip install mkdocs-static-i18n
          mkdocs build

      - name: Change custom domain
        run: |
          sed -i '/sagernet/s/sing-box.sagernet.org/sing-boxr.dustinwin.cc.cd/' ./site/CNAME

      - name: Git push assets to "docs" branch
        run: |
          cd ./site/ || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b docs
          git add .
          git commit -m "更新 sing-box reF1nd 版 docs 至 v${{ env.ref1nd_VERSION }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin docs

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 1
